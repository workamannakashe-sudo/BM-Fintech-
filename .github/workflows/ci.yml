name: BudgetMitra CI/CD Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Static code analysis (Oxlint)
        run: npm run lint

      - name: Strict TypeScript compilation check
        run: npx tsc --noEmit

      - name: Run Vitest unit & integration test suites
        run: npm test

      - name: Production bundle build
        run: npm run build
